<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报告查看器 - Linux Kernel Weekly</title>
    
    <!-- 引入必要的库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.0/github-markdown.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- 脚本库 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    
    <!-- 样式 -->
    <style>
        /* 基础重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary, #0f172a);
            color: var(--text-primary, #f1f5f9);
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }
        
        :root {
            --primary-color: #2563eb;
            --secondary-color: #7c3aed;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-tertiary: #94a3b8;
            --border-color: #475569;
            --border-hover: #64748b;
        }
        
        [data-theme="light"] {
            --primary-color: #3b82f6;
            --secondary-color: #8b5cf6;
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-tertiary: #94a3b8;
            --border-color: #e2e8f0;
            --border-hover: #cbd5e1;
        }
        
        /* 头部样式 */
        .viewer-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
            background: rgba(var(--bg-primary-rgb, 15, 23, 42), 0.95);
        }
        
        .header-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 0 1rem;
        }
        
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            border: none;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }
        
        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        
        .btn-secondary:hover {
            background: var(--bg-secondary);
            border-color: var(--border-hover);
        }
        
        .btn-primary {
            background: var(--primary-color);
            color: white;
        }
        
        .btn-primary:hover {
            background: color-mix(in srgb, var(--primary-color) 90%, black);
            transform: translateY(-1px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .viewer-controls {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* 阅读模式开关状态 */
        .btn-toggle-active {
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.3);
            border-color: var(--primary-color);
            background: rgba(37, 99, 235, 0.12);
            color: var(--primary-color);
        }
        
        /* 内容区域 */
        .viewer-container {
            display: flex;
            max-width: 1800px;
            margin: 0 auto;
            padding: 0 2rem;
            gap: 2rem; /* 添加间距 */
        }
        
        /* 目录样式 */
        .table-of-contents {
            position: sticky;
            top: 100px;
            width: 400px;
            max-height: calc(100vh - 140px);
            overflow-y: auto;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            margin-right: 2rem;
            flex-shrink: 0;
        }
        
        .toc-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .toc-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .toc-item {
            margin-bottom: 0.5rem;
        }
        
        .toc-link {
            font-size: 0.875rem;
            color: var(--text-secondary);
            text-decoration: none;
            display: block;
            padding: 0.375rem 0;
            border-radius: 4px;
            transition: all 0.2s;
        }
        
        .toc-link:hover {
            color: var(--primary-color);
            background: var(--bg-tertiary);
            padding-left: 0.5rem;
        }
        
        .toc-link.active {
            color: var(--primary-color);
            font-weight: 500;
            background: var(--bg-tertiary);
            padding-left: 0.5rem;
            border-left: 3px solid var(--primary-color);
        }
        
        .toc-link.level-1 {
            font-weight: 600;
        }
        
        .toc-link.level-2 {
            padding-left: 1rem;
        }
        
        .toc-link.level-3 {
            padding-left: 2rem;
        }
        
        /* Markdown 内容区域 */
        .markdown-viewer {
            flex: 1 1 auto; /* 允许增长和收缩 */
            max-width: 1600px;
            margin: 2rem 0;
        }

        /* Case 卡片 */
        .case-list {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .case-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            box-shadow: var(--shadow-sm, 0 4px 10px rgba(0,0,0,0.1));
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .case-card:hover {
            border-color: var(--primary-color);
            box-shadow: 0 6px 16px rgba(0,0,0,0.15);
        }

        .case-header {
            display: flex;
            gap: 0.75rem;
            align-items: flex-start;
            justify-content: space-between;
        }

        .case-title {
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
            line-height: 1.4;
            flex: 1;
        }

        .case-tags {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .case-tag {
            padding: 0.25rem 0.55rem;
            border-radius: 999px;
            border: 1px solid var(--border-color);
            background: var(--bg-tertiary);
            font-size: 0.78rem;
            color: var(--text-primary);
            text-transform: lowercase;
        }

        .case-tag.sev-critical, .case-tag.sev-high {
            border-color: rgba(239,68,68,0.55);
            color: #ef4444;
            background: rgba(239,68,68,0.15);
        }

        .case-tag.sev-medium {
            border-color: rgba(245,158,11,0.55);
            color: #f59e0b;
            background: rgba(245,158,11,0.15);
        }

        .case-tag.sev-low {
            border-color: rgba(52,211,153,0.55);
            color: #10b981;
            background: rgba(52,211,153,0.15);
        }

        .case-tag.type {
            border-style: dashed;
        }

        .case-body {
            margin-top: 0.75rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .case-actions {
            margin-top: 0.75rem;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .case-detail {
            display: none;
            margin-top: 0.9rem;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 2rem;
            background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
            box-shadow: 0 6px 14px rgba(0,0,0,0.12);
        }

        .case-detail.active {
            display: block;
        }

        .case-detail p {
            margin: 0 0 0.75rem;
            line-height: 1.7;
            color: var(--text-secondary);
        }

        .case-detail h4,
        .case-detail h5,
        .case-detail h6 {
            margin: 0.6rem 0 0.4rem;
            color: var(--text-primary);
        }

        .case-detail code {
            background: var(--bg-tertiary);
            padding: 0.15rem 0.35rem;
            border-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .case-detail pre {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            overflow: auto;
        }

        /* 暗色模式下提升链接可读性（参考链接、作者等） */
        [data-theme="dark"] .case-detail a,
        [data-theme="dark"] .markdown-body a {
            color: #8fb8ff;
        }

        [data-theme="dark"] .case-detail a:hover,
        [data-theme="dark"] .markdown-body a:hover {
            color: #b2cdff;
            text-decoration: underline;
        }

        .case-original-toggle {
            margin-top: 1.25rem;
        }

        /* 阅读模式：窄版/舒适/隐藏代码 */
        body.reading-narrow .markdown-viewer {
            max-width: 1100px;
        }

        body.reading-comfy .markdown-body {
            font-size: 18px;
            line-height: 1.85;
            letter-spacing: 0.01em;
        }

        body.reading-comfy .markdown-body p {
            margin-bottom: 1.15em;
        }

        /* 舒适模式下，卡片文字同步放大行距 */
        body.reading-comfy .case-card {
            font-size: 17px;
            line-height: 1.8;
        }

        body.reading-comfy .case-title {
            font-size: 1.05rem;
        }

        body.reading-comfy .case-body {
            line-height: 1.8;
        }
        
        .markdown-body {
            font-size: 16px;
            line-height: 1.7;
            background: var(--bg-primary);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            /* color: #e2e8f0; */
        }
        
        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3,
        .markdown-body h4,
        .markdown-body h5,
        .markdown-body h6 {
            position: relative;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            padding-left: 0.4rem;
        }

        .markdown-body h2 {
            border-left: 4px solid var(--primary-color);
            padding-left: 0.55rem;
        }

        .markdown-body h3 {
            border-left: 3px solid var(--border-color);
        }
        
        .markdown-body h1:hover .anchor-link,
        .markdown-body h2:hover .anchor-link,
        .markdown-body h3:hover .anchor-link,
        .markdown-body h4:hover .anchor-link,
        .markdown-body h5:hover .anchor-link,
        .markdown-body h6:hover .anchor-link {
            opacity: 1;
        }

        /* 只在深色主题下优化文字颜色 */
        [data-theme="dark"] .markdown-body {
            color: #e2e8f0;
        }

        [data-theme="dark"] .markdown-body h1,
        [data-theme="dark"] .markdown-body h2,
        [data-theme="dark"] .markdown-body h3,
        [data-theme="dark"] .markdown-body h4,
        [data-theme="dark"] .markdown-body h5,
        [data-theme="dark"] .markdown-body h6 {
            color: #f8fafc;
        }

        [data-theme="dark"] .markdown-body a {
            color: #60a5fa;
        }

        [data-theme="dark"] .markdown-body code {
            color: #fbbf24;
        }

        .anchor-link {
            position: absolute;
            left: -1.5rem;
            opacity: 0;
            color: var(--text-tertiary);
            text-decoration: none;
            transition: opacity 0.2s;
        }
        
        .anchor-link:hover {
            color: var(--primary-color);
        }
        
        /* 代码块样式 */
        .code-block {
            position: relative;
            margin: 1.5rem 0;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        
        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
        }
        
        .lang-label {
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .copy-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.375rem 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }
        
        .copy-btn:hover {
            background: var(--bg-tertiary);
            border-color: var(--primary-color);
            color: var(--text-primary);
        }
        
        .copy-btn.copied {
            background: var(--success-color);
            color: white;
            border-color: var(--success-color);
        }
        
        /* 加载动画 */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            color: var(--text-secondary);
        }
        
        .spinner {
            text-align: center;
        }
        
        .spinner-circle {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        
        /* 响应式设计 */
        @media (max-width: 1200px) {
            .table-of-contents {
                display: none;
            }
            
            .viewer-container {
                padding: 0 1rem;
            }
        }
        
        @media (max-width: 768px) {
            .viewer-header {
                padding: 1rem;
                flex-wrap: wrap;
            }
            
            .viewer-controls {
                flex-wrap: wrap;
            }
            
            .markdown-viewer {
                margin: 1rem 0;
            }
            
            .markdown-body {
                padding: 1.5rem;
            }

            .progress-track {
                top: 56px;
            }
        }
        
        /* 滚动条样式 */
        .table-of-contents::-webkit-scrollbar {
            width: 6px;
        }
        
        .table-of-contents::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
        }
        
        .table-of-contents::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }
        
        .table-of-contents::-webkit-scrollbar-thumb:hover {
            background: var(--border-hover);
        }

        /* 滚动进度条 */
        .progress-track {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.05);
            z-index: 1200;
        }

        .progress-bar {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            transition: width 0.1s ease;
        }
    </style>
</head>
<body>
    <div class="progress-track"><div id="scrollProgress" class="progress-bar"></div></div>
    <div class="viewer-header">
        <div style="display: flex; align-items: center;">
            <a href="index.html" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> 返回
            </a>
            <div class="header-title" id="reportTitle">Linux Kernel Weekly Report</div>
        </div>
        
        <div class="viewer-controls">
            <button class="btn btn-secondary" id="toggleOriginal" title="切换原文视图">
                <i class="fas fa-file-alt"></i>
            </button>
            <button class="btn btn-secondary" id="comfyToggle" title="舒适模式 (大字号/行距)">
                <i class="fas fa-leaf"></i>
            </button>
            <button class="btn btn-secondary" id="narrowToggle" title="窄版阅读 (聚焦正文)">
                <i class="fas fa-align-justify"></i>
            </button>
            <button class="btn btn-secondary" id="themeToggle">
                <i class="fas fa-moon"></i>
            </button>
            <button class="btn btn-secondary" id="tocToggle">
                <i class="fas fa-list"></i>
            </button>
            <button class="btn btn-secondary" id="printBtn">
                <i class="fas fa-print"></i>
            </button>
            <button class="btn btn-primary" id="downloadBtn">
                <i class="fas fa-download"></i> 下载
            </button>
        </div>
    </div>
    
    <div class="viewer-container">
        <aside class="table-of-contents" id="tableOfContents">
            <div class="toc-title">
                <i class="fas fa-list-ol"></i>
                目录
                <button class="toc-close" id="tocClose" style="margin-left: auto; background: none; border: none; color: var(--text-tertiary); cursor: pointer; font-size: 0.875rem;">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <nav class="toc-list" id="tocList">
                <div class="loading">
                    <div class="spinner-circle"></div>
                    <p>生成目录中...</p>
                </div>
            </nav>
        </aside>
        
        <main class="markdown-viewer">
            <div id="content">
                <div class="loading">
                    <div class="spinner-circle"></div>
                    <p>加载报告中...</p>
                </div>
            </div>
        </main>
    </div>
    
    <script>
        class ReportViewer {
            constructor() {
                this.currentFile = null;
                this.currentTitle = null;
                this.headers = [];
                this.isInitialized = false;
                
                this.init();
            }
            
            async init() {
                try {
                    await this.loadReportFromURL();
                    this.bindEvents();
                    this.setupTheme();
                    this.enableDefaultComfy();
                    this.setupTocToggle();
                    this.isInitialized = true;
                    console.log('ReportViewer initialized successfully');
                } catch (error) {
                    console.error('Error initializing ReportViewer:', error);
                    this.showError(`初始化失败: ${error.message}`);
                }
            }
            
            async loadReportFromURL() {
                const params = new URLSearchParams(window.location.search);
                const file = params.get('file');
                const title = params.get('title');
                
                console.log('URL Parameters:', { file, title });
                
                this.currentFile = file;
                this.currentTitle = title ? decodeURIComponent(title) : 'Linux Kernel Weekly Report';
                
                // 确保标题是字符串
                if (typeof this.currentTitle !== 'string') {
                    this.currentTitle = String(this.currentTitle || 'Linux Kernel Weekly Report');
                }
                
                // 更新标题
                const titleElement = document.getElementById('reportTitle');
                if (titleElement) {
                    titleElement.textContent = this.currentTitle;
                }
                document.title = `${this.currentTitle} - Linux Kernel Weekly`;
                
                if (file) {
                    // 确保 file 是字符串
                    const fileStr = String(file || '');
                    await this.loadAndRenderReport(fileStr);
                } else {
                    this.showError('没有指定报告文件');
                }
            }
            
            async loadAndRenderReport(filename) {
                try {
                    console.log('Loading report from:', filename);
                    
                    // 显示加载状态
                    const contentElement = document.getElementById('content');
                    if (contentElement) {
                        contentElement.innerHTML = `
                            <div class="loading">
                                <div class="spinner-circle"></div>
                                <p>加载报告中...</p>
                            </div>
                        `;
                    }
                    
                    // 获取报告内容
                    const response = await fetch(filename);
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    
                    const markdown = await response.text();
                    console.log('Markdown loaded, length:', markdown.length);
                    
                    // 渲染：优先用卡片化视图
                    await this.renderCasesOrMarkdown(markdown);
                    
                    console.log('Report loaded successfully');
                    this.updateScrollProgress();
                    
                } catch (error) {
                    console.error('Error loading report:', error);
                    this.showError(`加载报告失败: ${error.message}`);
                }
            }
            
            // 渲染：优先卡片化，每个 case 一张卡，可展开全文；保留“查看原文”按钮
            async renderCasesOrMarkdown(markdown) {
                // 兜底：非字符串强转
                if (typeof markdown !== 'string') {
                    markdown = String(markdown || '');
                }

                // 统一换行符，避免解析不到 #### 分段
                const normalized = markdown.replace(/\r\n/g, '\n');

                const contentElement = document.getElementById('content');
                if (!contentElement) return;

                // 解析 case 列表
                const cases = this.extractCases(normalized);

                // 同时准备原文 HTML，便于切换
                const originalHtml = this.toCleanHtml(normalized);

                if (cases.length) {
                    contentElement.innerHTML = `
                        <div class="case-list" id="caseList"></div>
                        <article class="markdown-body" id="originalArticle" style="display:none; margin-top:1rem;">${originalHtml}</article>
                    `;

                    this.renderCaseCards(cases);
                    this.bindCardToggles();
                    this.bindOriginalToggle();
                } else {
                    // 无法解析为 case 时，降级显示原文
                    contentElement.innerHTML = `<article class="markdown-body">${originalHtml}</article>`;
                }

                // 高亮代码
                if (window.hljs) {
                    hljs.highlightAll();
                }

                // 生成目录（对原文生成）
                this.generateTableOfContents();

                // 参考链接新开标签页
                this.forceLinksToNewTab(contentElement);

                // 更新下载按钮
                const downloadBtn = document.getElementById('downloadBtn');
                if (downloadBtn && this.currentFile) {
                    downloadBtn.onclick = () => this.downloadReport(this.currentFile);
                }

                // 初始化阅读模式按钮状态
                this.syncToggleStates();
            }

            toCleanHtml(markdown) {
                const html = marked.parse(markdown);
                return DOMPurify.sanitize(html, {
                    ADD_ATTR: ['target'],
                    ALLOWED_TAGS: [
                        'h1', 'h2', 'h3', 'h4', 'h5', 'h6',
                        'p', 'br', 'hr',
                        'ul', 'ol', 'li',
                        'strong', 'em', 'code', 'pre', 'blockquote',
                        'a', 'img', 'table', 'thead', 'tbody', 'tr', 'th', 'td',
                        'div', 'span'
                    ],
                    ALLOWED_ATTR: [
                        'class', 'id', 'href', 'title', 'target', 'src', 'alt',
                        'width', 'height', 'style'
                    ]
                });
            }

            extractCases(markdown) {
                const items = [];
                const regex = /####\s+\d+\.\s+(.+?)\n([\s\S]*?)(?=\n####\s+\d+\.|\n##\s|$)/g;
                let match;
                while ((match = regex.exec(markdown)) !== null) {
                    const title = match[1].trim();
                    const bodyMd = match[2].trim();
                    const type = this.matchField(bodyMd, /类型\*\*:\s*([a-zA-Z]+)/);
                    const severity = this.matchField(bodyMd, /严重程度\*\*:\s*([a-zA-Z]+)/);
                    const subsystem = this.matchField(bodyMd, /子系统\*\*:\s*([^\n]+)/);
                    const security = /安全相关/.test(bodyMd) || /CVE/i.test(bodyMd);
                    const rootCause = this.extractRootCause(bodyMd);
                    const fallback = (bodyMd.split(/\n\n/).find(t => t.trim()) || '').replace(/\n/g, ' ');
                    const snippet = (rootCause || fallback || '').substring(0, 200) + ((rootCause || fallback || '').length > 200 ? '…' : '');

                    items.push({
                        title,
                        type: (type || '').toLowerCase(),
                        severity: (severity || '').toLowerCase(),
                        subsystem: subsystem ? subsystem.trim() : '',
                        security,
                        snippet,
                        bodyMd
                    });
                }
                return items;
            }

            extractRootCause(bodyMd) {
                // 捕获“问题根源”段落
                const m = bodyMd.match(/问题根源[^\n]*\n+([\s\S]*?)(?:\n\n|\n\*\*|\n-\s|\n##|\n####|$)/);
                if (!m) return '';
                return m[1].trim().replace(/\n/g, ' ');
            }

            matchField(body, pattern) {
                const m = body.match(pattern);
                return m ? m[1] : '';
            }

            renderCaseCards(cases) {
                const container = document.getElementById('caseList');
                if (!container) return;

                const cardsHtml = cases.map((item, idx) => {
                    const tags = [
                        item.type && `<span class="case-tag type">${item.type}</span>`,
                        item.severity && `<span class="case-tag sev-${item.severity}">${item.severity}</span>`,
                        item.subsystem && `<span class="case-tag">${item.subsystem}</span>`,
                        item.security && '<span class="case-tag">security</span>'
                    ].filter(Boolean).join('');

                    const detailHtml = this.toCleanHtml(item.bodyMd);

                    return `
                        <div class="case-card" data-idx="${idx}" id="case-card-${idx}">
                            <div class="case-header">
                                <h3 class="case-title">${item.title}</h3>
                                <div class="case-tags">${tags}</div>
                            </div>
                            <div class="case-body">${this.escapeHtml(item.snippet)}</div>
                            <div class="case-actions">
                                <button class="btn btn-primary case-toggle" data-target="case-detail-${idx}">展开详情</button>
                            </div>
                            <div class="case-detail" id="case-detail-${idx}">
                                ${detailHtml}
                            </div>
                        </div>
                    `;
                }).join('');

                container.innerHTML = cardsHtml;
            }

            bindCardToggles() {
                document.querySelectorAll('.case-toggle').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.preventDefault();
                        const targetId = btn.dataset.target;
                        const panel = document.getElementById(targetId);
                        if (panel) {
                            const active = panel.classList.toggle('active');
                            btn.textContent = active ? '收起' : '展开详情';
                        }
                    });
                });

            }

            bindOriginalToggle() {
                const btn = document.getElementById('toggleOriginal');
                const article = document.getElementById('originalArticle');
                const caseList = document.getElementById('caseList');
                if (!btn || !article) return;
                btn.addEventListener('click', () => {
                    const visible = article.style.display !== 'none';
                    const willShowOriginal = !visible;

                    article.style.display = willShowOriginal ? 'block' : 'none';
                    if (caseList) {
                        caseList.style.display = willShowOriginal ? 'none' : 'block';
                    }

                    btn.classList.toggle('btn-toggle-active', willShowOriginal);
                    btn.title = willShowOriginal ? '隐藏原文' : '切换原文视图';
                    this.generateTableOfContents();
                });
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text == null ? '' : String(text);
                return div.innerHTML;
            }

            syncToggleStates() {
                const comfyToggle = document.getElementById('comfyToggle');
                const narrowToggle = document.getElementById('narrowToggle');

                if (comfyToggle && document.body.classList.contains('reading-comfy')) {
                    comfyToggle.classList.add('btn-toggle-active');
                }
                if (narrowToggle && document.body.classList.contains('reading-narrow')) {
                    narrowToggle.classList.add('btn-toggle-active');
                }
            }

            enableDefaultComfy() {
                document.body.classList.add('reading-comfy');
                const comfyToggle = document.getElementById('comfyToggle');
                if (comfyToggle) {
                    comfyToggle.classList.add('btn-toggle-active');
                }
            }
            
            generateTableOfContents() {
                const tocList = document.getElementById('tocList');
                if (!tocList) return;

                const caseList = document.getElementById('caseList');
                const originalArticle = document.getElementById('originalArticle');
                const showingOriginal = originalArticle && originalArticle.style.display !== 'none';

                // 当卡片存在且当前展示卡片模式时，用卡片生成目录
                if (caseList && caseList.children.length && !showingOriginal) {
                    let tocHTML = '';
                    [...caseList.children].forEach((card, idx) => {
                        const titleEl = card.querySelector('.case-title');
                        const text = titleEl ? titleEl.textContent.trim() : `Case ${idx + 1}`;
                        const targetId = card.id || `case-card-${idx}`;
                        card.id = targetId;
                        tocHTML += `
                            <li class="toc-item">
                                <a href="#${targetId}" class="toc-link level-2">${text}</a>
                            </li>
                        `;
                    });

                    tocList.innerHTML = tocHTML || '<div style="color: var(--text-tertiary); text-align: center; padding: 1rem;">暂无目录</div>';
                    this.bindTocLinks();
                    return;
                }

                // 否则对原文生成目录
                const article = document.querySelector('.markdown-body');
                if (!article) {
                    tocList.innerHTML = '<div style="color: var(--text-tertiary); text-align: center; padding: 1rem;">暂无目录</div>';
                    return;
                }

                const headers = article.querySelectorAll('h1, h2, h3, h4, h5, h6');
                if (!headers.length) {
                    tocList.innerHTML = '<div style="color: var(--text-tertiary); text-align: center; padding: 1rem;">暂无目录</div>';
                    return;
                }

                let tocHTML = '';
                headers.forEach((header, index) => {
                    if (!header.id) {
                        header.id = `header-${index}`;
                    }
                    const level = parseInt(header.tagName.substring(1));
                    const text = header.textContent || `标题 ${index + 1}`;
                    const indent = (level - 1) * 20;
                    tocHTML += `
                        <li class="toc-item">
                            <a href="#${header.id}" class="toc-link level-${level}" style="padding-left: ${indent}px">${text}</a>
                        </li>
                    `;
                });

                tocList.innerHTML = tocHTML;
                this.bindTocLinks();
            }
            
            bindTocLinks() {
                const tocList = document.getElementById('tocList');
                if (!tocList) return;
                
                tocList.querySelectorAll('.toc-link').forEach(link => {
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        const targetId = link.getAttribute('href').substring(1);
                        const targetElement = document.getElementById(targetId);
                        
                        if (targetElement) {
                            // 滚动到目标
                            targetElement.scrollIntoView({
                                behavior: 'smooth',
                                block: 'start'
                            });
                            
                            // 高亮当前目录项
                            tocList.querySelectorAll('.toc-link').forEach(l => l.classList.remove('active'));
                            link.classList.add('active');
                        }
                    });
                });
            }
            
            downloadReport(filename) {
                const link = document.createElement('a');
                link.href = filename;
                link.download = filename.split('/').pop() || 'report.md';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

            forceLinksToNewTab(scopeEl) {
                const root = scopeEl || document;
                const links = root.querySelectorAll('.markdown-body a, .case-detail a, .case-body a');
                links.forEach(a => {
                    a.setAttribute('target', '_blank');
                    a.setAttribute('rel', 'noopener noreferrer');
                });
            }
            
            showError(message) {
                console.error('Showing error:', message);
                
                const contentElement = document.getElementById('content');
                if (contentElement) {
                    contentElement.innerHTML = `
                        <div style="text-align: center; padding: 4rem 2rem;">
                            <i class="fas fa-exclamation-triangle" style="font-size: 3rem; color: var(--danger-color); margin-bottom: 1rem;"></i>
                            <h3 style="color: var(--text-primary); margin-bottom: 1rem;">加载失败</h3>
                            <p style="color: var(--text-secondary); margin-bottom: 2rem;">${message}</p>
                            <div style="display: flex; gap: 1rem; justify-content: center;">
                                <a href="index.html" class="btn btn-primary">
                                    <i class="fas fa-home"></i> 返回首页
                                </a>
                                <button onclick="location.reload()" class="btn btn-secondary">
                                    <i class="fas fa-redo"></i> 重新加载
                                </button>
                            </div>
                        </div>
                    `;
                }
            }
            
            bindEvents() {
                // 主题切换
                const themeToggle = document.getElementById('themeToggle');
                if (themeToggle) {
                    themeToggle.addEventListener('click', () => {
                        const currentTheme = document.documentElement.getAttribute('data-theme');
                        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                        
                        this.setTheme(newTheme);
                        
                        // 更新按钮图标
                        const icon = themeToggle.querySelector('i');
                        icon.className = newTheme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
                    });
                }
                
                // 目录显示/隐藏
                const tocToggle = document.getElementById('tocToggle');
                if (tocToggle) {
                    tocToggle.addEventListener('click', () => {
                        const toc = document.getElementById('tableOfContents');
                        if (toc) {
                            toc.style.display = toc.style.display === 'none' ? 'block' : 'none';
                        }
                    });
                }
                
                // 目录关闭按钮
                const tocClose = document.getElementById('tocClose');
                if (tocClose) {
                    tocClose.addEventListener('click', () => {
                        document.getElementById('tableOfContents').style.display = 'none';
                    });
                }
                
                // 打印
                const printBtn = document.getElementById('printBtn');
                if (printBtn) {
                    printBtn.addEventListener('click', () => {
                        window.print();
                    });
                }

                // 滚动进度
                window.addEventListener('scroll', () => this.updateScrollProgress());
                // 舒适模式
                const comfyToggle = document.getElementById('comfyToggle');
                if (comfyToggle) {
                    comfyToggle.addEventListener('click', () => {
                        document.body.classList.toggle('reading-comfy');
                        comfyToggle.classList.toggle('btn-toggle-active');
                    });
                }

                // 窄版模式
                const narrowToggle = document.getElementById('narrowToggle');
                if (narrowToggle) {
                    narrowToggle.addEventListener('click', () => {
                        document.body.classList.toggle('reading-narrow');
                        narrowToggle.classList.toggle('btn-toggle-active');
                    });
                }
            }

            updateScrollProgress() {
                const progress = document.getElementById('scrollProgress');
                const article = document.querySelector('.markdown-body');
                if (!progress || !article) return;

                const doc = document.documentElement;
                const scrollTop = window.scrollY || doc.scrollTop;
                const scrollHeight = doc.scrollHeight - doc.clientHeight;
                const percent = scrollHeight > 0 ? Math.min(100, Math.max(0, (scrollTop / scrollHeight) * 100)) : 0;
                progress.style.width = `${percent}%`;
            }
            
            setupTheme() {
                const savedTheme = localStorage.getItem('theme') || 'dark';
                this.setTheme(savedTheme);
                
                // 更新按钮图标
                const themeToggle = document.getElementById('themeToggle');
                if (themeToggle) {
                    const icon = themeToggle.querySelector('i');
                    icon.className = savedTheme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
                }
            }
            
            setTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
                
                // 更新背景颜色 RGB 值
                const root = document.documentElement;
                if (theme === 'dark') {
                    root.style.setProperty('--bg-primary-rgb', '15, 23, 42');
                } else {
                    root.style.setProperty('--bg-primary-rgb', '255, 255, 255');
                }
            }
            
            setupTocToggle() {
                // 响应式：小屏幕隐藏目录
                window.addEventListener('resize', () => {
                    const toc = document.getElementById('tableOfContents');
                    if (window.innerWidth < 1200 && toc) {
                        toc.style.display = 'none';
                    }
                });
            }
        }
        
        // 初始化查看器
        document.addEventListener('DOMContentLoaded', () => {
            window.viewer = new ReportViewer();
            
            // 防止页面卡死
            setTimeout(() => {
                const content = document.getElementById('content');
                const loading = content?.querySelector('.loading');
                const viewer = window.viewer;
                
                if (loading && viewer && !viewer.isInitialized) {
                    console.warn('Page seems stuck, showing fallback');
                    viewer.showError('页面加载超时，请刷新重试或检查报告文件');
                }
            }, 10000); // 10秒后检查
        });
    </script>
</body>
</html>
